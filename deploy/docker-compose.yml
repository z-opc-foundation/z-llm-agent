# z-llm-agent-proxy 单进程部署
# 启动：cd deploy && docker compose up -d
# 停止：docker compose down

services:
  z-llm-agent-proxy:
    container_name: z-llm-agent-proxy
    image: "${OCI_REGISTRY:-ghcr.io/yuku123}/z-llm-agent-proxy:${IMAGE_VERSION:-1.0.0}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "9098:9098"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"
